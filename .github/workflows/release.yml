name: Release

# Cutting a release:
#   1. Bump "version" in package.json and rewrite build/release-notes.md for
#      this release (electron-builder puts it in the latest*.yml manifests,
#      and the app's update prompt shows it). Merge that as a PR.
#   2. git tag v1.2.3 && git push origin v1.2.3
#
# electron-builder publishes the installers *and* the latest*.yml manifests that
# electron-updater reads. Without those manifests the app has nothing to check
# against, which is why no update has ever been delivered so far.
#
# Every platform uploads into a *draft* release, and the `publish` job makes it
# public only once all of them have built and verified. Otherwise a build that
# fails verification would already have shipped its artifacts and manifest to
# every installed client. A manual (workflow_dispatch) run never publishes, so
# it doubles as a dry run whose draft can be inspected and deleted.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    # Raised only for the job that creates the GitHub release.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: bun run release -- --mac
          - os: windows-latest
            build: bun run release -- --win
          - os: ubuntu-latest
            build: bun run release -- --linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Secrets are exported to the env names electron-builder reads only when
      # they are actually set. Mapping them directly under `env:` would hand
      # electron-builder an empty string for CSC_LINK, which it treats as a
      # certificate to import rather than as "no certificate", and the build
      # would fail instead of shipping unsigned.
      #
      # Repository secrets:
      #   MAC_CSC_LINK          base64 of the Developer ID Application .p12
      #   MAC_CSC_KEY_PASSWORD  its password
      #   APPLE_API_KEY_P8      contents of the App Store Connect API .p8 key
      #   APPLE_API_KEY_ID      the key id
      #   APPLE_API_ISSUER      the issuer uuid
      # The API key needs the Developer role. It is preferred over an Apple ID
      # + app-specific password because it is not tied to a person's login or
      # their 2FA.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "$MAC_CSC_LINK" ]; then
            echo "::warning::MAC_CSC_LINK is not set; the macOS build will be unsigned and auto-update cannot apply it."
            exit 0
          fi
          {
            echo "CSC_LINK=$MAC_CSC_LINK"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD"
            echo "MAC_SIGNING=1"
          } >> "$GITHUB_ENV"

          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::warning::APPLE_API_KEY_P8 is not set; the macOS build will be signed but not notarized, and Gatekeeper will refuse to open it."
            exit 0
          fi
          key_file="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key_file"
          chmod 600 "$key_file"
          {
            echo "APPLE_API_KEY=$key_file"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      # electron-builder.yml sets releaseType: release for local `bun run
      # release`; here it is overridden so nothing is public until `publish`.
      # bash on every runner: Windows defaults to PowerShell, which splits
      # `-c.publish.releaseType=draft` at the first dot and hands
      # electron-builder `.publish.releaseType=draft` as a config file path.
      - name: Build and upload to draft release
        shell: bash
        run: ${{ matrix.build }} -c.publish.releaseType=draft
        env:
          # Provided automatically; electron-builder uses it to create/update
          # the draft GitHub release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ---- Windows signing (not yet configured) ----
          # WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # A bad certificate or a rejected notarization should fail the release,
      # not surface as a Gatekeeper dialog on a customer's machine. spctl
      # applies the same policy Gatekeeper does, so it also catches a signed
      # but un-notarized (or un-stapled) app.
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && env.MAC_SIGNING == '1'
        run: |
          set -euo pipefail
          app=$(find dist-electron -maxdepth 2 -name '*.app' -print -quit)
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"

  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # Opens the winget-pkgs PR for this version (`winget install episki.episki`).
  #
  # komac is what vedantmgoyal9/winget-releaser wraps; it is called directly so
  # the binary is pinned and checksummed rather than installed from an unpinned
  # @main action while the token below is in scope.
  #
  # WINGET_TOKEN: a classic PAT with `public_repo`. komac opens the PR from the
  # token owner's winget-pkgs fork (justinleapline/winget-pkgs today); winget
  # PRs have to come from a user's fork, so this cannot be GITHUB_TOKEN.
  winget:
    needs: publish
    runs-on: ubuntu-latest
    env:
      KOMAC_VERSION: 2.16.0
      KOMAC_SHA256: 7d2707fa6210f2789a3702de49fbd150b736dbf426ee0b9bc8e098736f9fd82d
    steps:
      - name: Submit to winget
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::warning::WINGET_TOKEN is not set; skipping the winget submission."
            exit 0
          fi
          # komac can only update a package that is already in winget-pkgs; the
          # first version was submitted by hand.
          # Only a 404 means "not there yet"; a rate limit or outage must fail
          # the job so the missed submission is visible and can be re-run.
          if ! err=$(gh api repos/microsoft/winget-pkgs/contents/manifests/e/episki/episki 2>&1 >/dev/null); then
            if grep -q 'HTTP 404' <<<"$err"; then
              echo "::warning::episki.episki is not in winget-pkgs yet; skipping."
              exit 0
            fi
            echo "$err" >&2
            exit 1
          fi

          archive="komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VERSION}/${archive}"
          echo "${KOMAC_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          komac=$(find "$RUNNER_TEMP" -type f -name komac -perm -u+x | head -1)

          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/episki-windows.exe"
          GITHUB_TOKEN="$WINGET_TOKEN" "$komac" update episki.episki \
              --version "$version" \
              --urls "$url" \
              --release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
              --submit
