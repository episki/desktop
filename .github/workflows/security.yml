name: security

# Supply-chain and secret checks that need no build. CodeQL is not here: it
# runs from GitHub's code-scanning default setup (repo Settings → Code security).

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Advisories land without a code change, so check main weekly as well.
  schedule:
    - cron: '17 6 * * 1'

jobs:
  # Fails on high/critical advisories in the installed dependency tree.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # Dependabot's bun ecosystem reads bun.lock lockfileVersion 1 only. bun
      # 1.4 writes 2 when it creates a lockfile from scratch, and from then on
      # every weekly Dependabot run fails and no update ever arrives.
      - name: Check bun.lock stays Dependabot-readable
        run: |
          version=$(sed -n 's/^  "lockfileVersion": \([0-9]*\),$/\1/p' bun.lock)
          if [ "$version" != "1" ]; then
            echo "::error file=bun.lock::bun.lock declares lockfileVersion '$version'; Dependabot only reads 1. Set the marker back to 1 and run 'bun install --frozen-lockfile' to confirm."
            exit 1
          fi

      - name: Audit dependencies 🛡️
        run: bun audit --audit-level=high

  # gitleaks over the full git history, so a secret committed and then removed
  # in a later commit of the same PR is still caught.
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Scan for secrets 🔑
        run: /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1
