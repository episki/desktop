name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions get the minimum they need; the release workflow raises this itself.
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

  # A dir-only pack validates electron-builder.yml -- icon generation, the files
  # globs, the app-update.yml manifest -- without publishing anything. A plain
  # typecheck would not have caught the missing icon assets or the wrong
  # publish target.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack (no publish)
        run: bun run compile && bunx electron-builder --linux dir --publish never
