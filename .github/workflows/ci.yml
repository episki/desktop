name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions get the minimum they need; the release workflow raises this itself.
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

  # build/icon.png is a checked-in artifact: committing it is what lets a fresh
  # clone package without librsvg and ImageMagick installed. The cost is that it
  # can drift from icon.svg -- edit the SVG, forget to re-render, and the app
  # ships the old icon while the source says otherwise. Nothing else catches
  # that, since the PNG is binary and reviews skip it.
  #
  # Compared perceptually rather than byte for byte: a different librsvg build
  # on the runner produces a different encoding of the same picture, so a hash
  # check would fail on renderer upgrades instead of on drift. RMSE is 0 for a
  # matching render and 0.2 for something as small as the mark changing size,
  # so 0.02 sits far above encoder noise and far below any real change.
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install renderer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick

      - name: Check build/icon.png matches icon.svg
        run: |
          set -euo pipefail
          rsvg-convert -w 1024 -h 1024 icon.svg -o /tmp/icon-rendered.png
          # ImageMagick 7 moved `compare` under the `magick` driver.
          if command -v compare >/dev/null; then cmp_cmd="compare"; else cmp_cmd="magick compare"; fi
          # `compare` exits non-zero whenever the images differ at all, which
          # under `set -e` would abort before we get to judge the magnitude.
          rmse=$($cmp_cmd -metric RMSE /tmp/icon-rendered.png build/icon.png null: 2>&1 || true)
          rmse=$(printf '%s' "$rmse" | sed -n 's/.*(\([0-9.e-]*\)).*/\1/p')
          if [ -z "$rmse" ]; then
            echo "::error file=build/icon.png::Could not compare icon.svg against build/icon.png (differing dimensions?)"
            exit 1
          fi
          echo "RMSE vs committed PNG: $rmse"
          if awk -v r="$rmse" 'BEGIN { exit !(r > 0.02) }'; then
            echo "::error file=build/icon.png::build/icon.png does not match icon.svg. Regenerate it: rsvg-convert -w 1024 -h 1024 icon.svg -o build/icon.png"
            exit 1
          fi

  # A dir-only pack validates electron-builder.yml -- icon generation, the files
  # globs, the app-update.yml manifest -- without publishing anything. A plain
  # typecheck would not have caught the missing icon assets or the wrong
  # publish target.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack (no publish)
        run: bun run compile && bunx electron-builder --linux dir --publish never
