appId: com.episki.desktop
productName: episki
copyright: Copyright (c) episki

protocols:
  - name: episki
    schemes:
      - episki

directories:
  # build/icon.png (1024x1024) is the single icon source. electron-builder
  # derives icon.icns, icon.ico and the Linux PNG set from it at pack time, so
  # there is nothing to generate before building from a fresh clone.
  # Regenerate it from icon.svg (see README) with:
  #   rsvg-convert -w 1024 -h 1024 icon.svg -o build/icon.png
  buildResources: build
  output: dist-electron

files:
  - dist/**/*

# Installer names carry no version, so episki.com links to them through
# GitHub's permanent github.com/episki/desktop/releases/latest/download/<name>
# URL with no API lookup. Renaming one breaks episki.com/download/<platform>
# (shared/desktop/release.ts in episki.com), so change both together.
# Updates are unaffected: electron-updater reads the latest*.yml manifests,
# finds the previous blockmap through the version in the release tag's path,
# and overwrites a version-less AppImage in place.

mac:
  category: public.app-category.business
  target:
    # The zip target is what Squirrel.Mac consumes; without it macOS cannot
    # auto-update even when the DMG is published.
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  # ---------------------------------------------------------------------
  # CODE SIGNING / NOTARIZATION
  #
  # macOS will not apply a Squirrel update to an unsigned app: the update
  # downloads and then silently fails to install. Unsigned builds are also
  # never registered with Notification Center, so notifications no-op.
  #
  # Signing happens whenever CSC_LINK / CSC_KEY_PASSWORD are set (a
  # "Developer ID Application" .p12, base64-encoded). Notarization runs
  # after signing whenever the App Store Connect API key env vars are set:
  #   APPLE_API_KEY      path to the .p8 file
  #   APPLE_API_KEY_ID   key id
  #   APPLE_API_ISSUER   issuer uuid
  # Notarization is only attempted once the app has actually been signed.
  # With no certificate electron-builder logs "skipped macOS application
  # code signing" and produces an unsigned build; with a certificate but no
  # API key it logs "skipped macOS notarization". Either way the build
  # succeeds, so a local `bun run build:mac` works without credentials.
  #
  # .github/workflows/release.yml maps the repository secrets onto those
  # env vars; see its "Configure macOS signing" step.
  # ---------------------------------------------------------------------
  notarize: true

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  # ---------------------------------------------------------------------
  # Unsigned Windows builds trigger a SmartScreen warning on install and on
  # every update. To enable, obtain an OV/EV code-signing certificate and
  # uncomment (electron-builder 26 shape):
  # signtoolOptions:
  #   certificateFile: ${env.WIN_CSC_LINK}
  #   certificatePassword: ${env.WIN_CSC_KEY_PASSWORD}
  # ---------------------------------------------------------------------

linux:
  target:
    # Only AppImage supports auto-update; .deb users update via apt/manual.
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office

appImage:
  artifactName: ${productName}-linux.${ext}

deb:
  artifactName: ${productName}-linux.${ext}

dmg:
  artifactName: ${productName}-mac.${ext}

nsis:
  # One installer carrying both x64 and arm64.
  artifactName: ${productName}-windows.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: episki
  repo: desktop
  # Without this electron-builder creates a *draft* release. Drafts are not
  # visible anonymously, so electron-updater clients would find nothing --
  # artifacts uploaded, no update ever delivered.
  releaseType: release
