appId: com.episki.desktop
productName: episki
copyright: Copyright (c) episki

protocols:
  - name: episki
    schemes:
      - episki

directories:
  buildResources: icons
  output: dist-electron

files:
  - dist/**/*

mac:
  category: public.app-category.business
  icon: icons/mac/icon.icns
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist

win:
  icon: icons/win/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]

linux:
  icon: icons/png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: episki
  repo: electron
